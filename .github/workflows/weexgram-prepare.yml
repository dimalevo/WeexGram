name: Prepare and Build WeexGram

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Download repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract WeexGram kit
        run: |
          unzip -q WeexGram-kit.zip -d "$RUNNER_TEMP/weexgram-kit"

      - name: Select compatible source version
        run: |
          git checkout --detach 0f1c6aa243d8509339f528f35887b6d91d051a03

      - name: Apply WeexGram code
        run: |
          python3 "$RUNNER_TEMP/weexgram-kit/WeexGram-kit/apply.py" "$GITHUB_WORKSPACE"
          git diff --check

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          cp private.properties.example private.properties
          echo "TELEGRAM_API_ID=2040" >> private.properties
          echo "TELEGRAM_API_HASH=b18441a1ff607e10a989891a5462e627" >> private.properties
          chmod +x gradlew
          ./gradlew :TMessagesProj_AppStandalone:assembleAfatStandalone -PngArm64Only --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WeexGram-APK
          path: TMessagesProj_AppStandalone/build/outputs/apk/afat/standalone/app.apk
